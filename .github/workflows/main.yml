name: Generate Stats Images

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: generated-statistics
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    if: github.repository == 'edbfi/github-stats' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Require successful final-revision CI
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        result=$(gh run list --workflow ci.yml --branch master --commit "$GITHUB_SHA" --json conclusion,event,status --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | first | .status == "completed" and .conclusion == "success"')
        test "$result" = true

    - name: Verify statistics identity
      env:
        GH_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
      run: |
        test -n "$GH_TOKEN"
        gh api user --jq 'select(.id == 326875205 and .login == "edbfi") | .login' > "$RUNNER_TEMP/stats-user"
        test "$(cat "$RUNNER_TEMP/stats-user")" = edbfi

    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}

    - uses: mlugg/setup-zig@v2.2.1
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Checkout history branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Push generated files to the generated branch
        if git ls-remote --exit-code --heads origin generated > /dev/null; then
          git fetch origin generated
          git checkout -B generated FETCH_HEAD
        else
          status=$?
          test "$status" = 2
          git checkout -b generated
        fi

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
        EXCLUDE_PRIVATE: "false"
        OWNED_REPOS_ONLY: "true"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git add overview.svg languages.svg
        if ! git diff --cached --quiet; then
          git commit -s -m 'chore(stats): refresh generated images'
          git push --set-upstream origin generated
        fi
