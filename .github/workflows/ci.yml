name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  zig:
    uses: edbfi/automation/.github/workflows/zig.yml@v4.1.0
    with:
      # renovate: datasource=git-tags depName=https://codeberg.org/ziglang/zig.git
      version: '0.16.0'
      command: bash .github/scripts/check.sh
  required:
    name: ci / required
    if: always()
    needs: [zig]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.0
        with:
          needs: ${{ toJSON(needs) }}
          required: zig
