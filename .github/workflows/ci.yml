name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.2.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  zig:
    needs: guard
    uses: edbfi/automation/.github/workflows/zig.yml@v1.2.0
    with:
      # renovate: datasource=zig-version depName=zig
      version: '0.16.0'
      command: bash .github/scripts/check.sh
  required:
    name: ci / required
    if: always()
    needs: [guard, zig]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.2.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v1.2.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard zig
